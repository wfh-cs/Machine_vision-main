[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gearpro-machine-vision"
version = "0.1.0"
description = "Real-time industrial part inspection with YOLO, OpenCV, PyQt5, and serial actuation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "GearPro contributors" }]
dynamic = ["dependencies"]

[tool.setuptools]
py-modules = [
  "gp_main",
  "gp_config",
  "gp_globals",
  "gp_mainwindow",
  "gp_cameradisplaywidget",
  "gp_detectiondisplaywidget",
  "gp_detectionworker",
  "gp_serial",
]

[tool.setuptools.packages.find]
include = ["ultralytics*"]

[tool.setuptools.data-files]
"." = ["best.pt", "best.onnx", "newb.pt", "gear.dlc"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.scripts]
gearpro = "gp_main:main"
